# AWS プロファイル。ローカル既定（SQLite）は変えない。
# Fargate では SPRING_PROFILES_ACTIVE=aws
server:
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/postgres

cors:
  origins: ${CORS_ORIGINS:http://127.0.0.1:5173}

app:
  storage: s3
  image-bucket: ${IMAGE_BUCKET}
