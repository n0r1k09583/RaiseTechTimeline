server:
  port: ${PORT:8080}
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/timeline.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-for-class}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  origins: http://localhost:5173,http://127.0.0.1:5173
